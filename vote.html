<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Vote</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/vote.css">
</head>
<body>
  <div class="bg"><span class="glow g1"></span><span class="glow g2"></span></div>

  <main class="phone">
    <header class="phone-head">
      <div class="star-logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.1" aria-hidden="true"><rect x="5.5" y="5.5" width="13" height="13"/><rect x="5.5" y="5.5" width="13" height="13" transform="rotate(45 12 12)"/><circle cx="12" cy="12" r="1.8" fill="currentColor"/></svg>
      </div>
      <h1 id="title"></h1>
      <p id="who"></p>
    </header>
    <section id="view" aria-live="polite"></section>
  </main>

  <script src="config.js"></script>
  <script src="content.js"></script>
  <script src="js/voting.js"></script>
  <script src="js/vote-page.js"></script>
</body>
</html>
