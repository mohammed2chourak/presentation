<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Presentation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/slides.css">
</head>
<body>
  <!-- animated Zellige background + gold frame -->
  <div class="bg"><span class="glow g1"></span><span class="glow g2"></span></div>
  <div class="frame"><i></i><i></i><i></i><i></i></div>

  <!-- slides are generated from content.js -->
  <main id="deck" class="deck"></main>

  <!-- progress bar, navigation, overview and presenter panel are generated by js/app.js -->
  <div id="chrome"></div>

  <noscript>JavaScript is required.</noscript>

  <!-- QR code library (small) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <script src="config.js"></script>
  <script src="content.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/voting.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
